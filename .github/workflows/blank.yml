name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Get Code
      uses: actions/checkout@v4

    - name: Extract Project
      run: unzip *.zip -d project_code

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Compile and Build APK
      run: |
        cd project_code
        PROJECT_DIR=$(dirname $(find . -name "settings.gradle.kts" | head -n 1))
        cd $PROJECT_DIR
        
        # 1. KSP Error Fix (Headless mode crash)
        sed -i 's/kotlin.compiler.execution.strategy=in-process//g' gradle.properties || true
        
        # 2. Missing Keystore Error Fix
        sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")//g' app/build.gradle.kts || true
        
        # Build command
        gradle assembleDebug

    - name: Save APK
      uses: actions/upload-artifact@v4
      with:
        name: Photo-Wallet-App
        path: project_code/**/app/build/outputs/apk/debug/*.apk
        
